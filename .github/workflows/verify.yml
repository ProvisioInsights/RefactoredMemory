name: Synthetic qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Run synthetic tests
        run: python3 -m unittest discover -s tests -v
      - name: Run the three day-one journeys
        run: python3 -m examples.synthetic_demo

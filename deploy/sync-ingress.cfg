global
    maxconn 32
    nbthread 1
defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
resolvers docker
    parse-resolv-conf
    hold valid 10s
frontend private_sync
    bind :8766
    default_backend memory_sync
backend memory_sync
    server memory memory:8766 resolvers docker init-addr last,libc,none

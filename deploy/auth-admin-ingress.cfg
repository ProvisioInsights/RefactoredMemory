global
    maxconn 32
    nbthread 1
defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
resolvers docker
    parse-resolv-conf
    hold valid 10s
frontend private_auth_admin
    bind :8443
    default_backend authorization_server
backend authorization_server
    server keycloak keycloak:8443 resolvers docker init-addr last,libc,none
